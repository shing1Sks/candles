<!doctype html><html><body><script type="module">
// dev-only: real cost of a painted card, including the GPU flush (getImageData forces it)
import { Painter } from './src/art/paint.js';
import { kidSpec, paintKid } from './src/art/kids.js';
import { headmaster } from './src/art/school.js';
const out = [];
const run = (label, w, h, draw, opts) => {
  const t = performance.now();
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', opts);
  draw(new Painter(x, 3)); x.getImageData(0, 0, 1, 1);
  out.push(`${label} ${Math.round(performance.now() - t)} ms`);
};
const k = kidSpec(201);
run('warmup', 100, 100, (p) => paintKid(p, k));
for (const [name, opts] of [['gpu', {}], ['cpu', { willReadFrequently: true }]]) {
  run(`${name} headmaster`, 640, 1160, headmaster, opts);
  run(`${name} kid`, 420, 660, (p) => paintKid(p, k), opts);
}
// without the blur filter on shadows
const orig = Painter.prototype.shadow;
Painter.prototype.shadow = function (poly, ox, oy, blur, a) {
  const ctx = this.ctx, { path } = this.pathOf(poly.map(([x, y]) => [x + ox, y + oy]));
  ctx.save(); ctx.fillStyle = `rgba(20,18,16,${(a ?? 0.3) * 0.5})`; ctx.fill(path); ctx.translate(-ox * 0.4, -oy * 0.4); ctx.fill(path); ctx.restore();
};
for (const [name, opts] of [['gpu-noblur', {}], ['cpu-noblur', { willReadFrequently: true }]]) {
  run(`${name} headmaster`, 640, 1160, headmaster, opts);
  run(`${name} kid`, 420, 660, (p) => paintKid(p, k), opts);
}
document.body.dataset.out = out.join('\n'); document.body.dataset.ready = '1';
</script></body></html>
