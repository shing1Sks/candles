<!doctype html>
<html><head><meta charset="utf-8"><title>kids preview</title>
<style>body{margin:0;background:#2a2826;display:flex;flex-wrap:wrap;gap:4px;padding:8px} canvas{height:200px;background:#b8b4ac}</style></head>
<body><script type="module">
// dev-only: paint a sheet of generated children (front / back / snapped)
import { Painter } from './src/art/paint.js';
import { kidSpec, paintKid } from './src/art/kids.js';
const n = Number(new URLSearchParams(location.search).get('n') || 16);
for (let i = 0; i < n; i++) {
  const k = kidSpec(100 + i);
  for (const opts of [{}, { back: true }, { snap: 2.3 }]) {
    const c = document.createElement('canvas'); c.width = 420; c.height = 660;
    paintKid(new Painter(c.getContext('2d'), 500 + i), k, opts);
    c.title = JSON.stringify(k); document.body.append(c);
  }
}
document.body.dataset.ready = '1';
</script></body></html>
