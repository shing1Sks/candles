<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GameNet concept sheet</title>
<style>
  body { margin: 0; background: #2b2a28; color: #d8d4cc; font: 14px/1.4 Georgia, serif; }
  header { padding: 24px 32px 8px; }
  h1 { margin: 0; font-weight: normal; letter-spacing: 0.04em; }
  header p { margin: 4px 0 0; color: #9a968e; }
  main { display: flex; flex-wrap: wrap; gap: 24px; padding: 16px 32px 48px; align-items: flex-start; }
  figure { margin: 0; background: #3a3936; padding: 10px; }
  figure canvas { display: block; height: 420px; width: auto; }
  figure.wide canvas { height: 300px; }
  figcaption { margin-top: 8px; max-width: 520px; color: #b8b4ac; }
  button { margin-top: 6px; background: #555; color: #eee; border: 0; padding: 4px 10px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>GameNet: concept sheet v1</h1>
  <p>Procedurally painted from the doodles. Throwaway spike, for judging look and mood. <button id="saveAll">Save all cards to assets/art</button> <span id="status"></span></p>
</header>
<main id="sheet"></main>
<script type="module">
import { Painter } from './paint.js';
import { DESIGNS } from './designs.js';

const sheet = document.getElementById('sheet');
const cards = [];
const only = new URLSearchParams(location.search).get('only');
DESIGNS.forEach((d, i) => {
  if (only && d.name !== only) return;
  // transparent card (what the game will use)
  const card = document.createElement('canvas');
  card.width = d.W; card.height = d.H;
  d.draw(new Painter(card.getContext('2d'), 101 + i));
  cards.push([d.name, card]);

  // shown on a grey ground
  const view = document.createElement('canvas');
  view.width = d.W; view.height = d.H;
  const vctx = view.getContext('2d');
  if (!d.scene) new Painter(vctx, 900 + i).paper(d.W, d.H, 0.72);
  vctx.drawImage(card, 0, 0);

  const fig = document.createElement('figure');
  if (d.W > d.H) fig.className = 'wide';
  if (only) view.style.height = d.W > d.H ? 'auto' : '740px', view.style.width = d.W > d.H ? Math.min(1180, d.W * 1.6) + 'px' : 'auto';
  const cap = document.createElement('figcaption');
  cap.textContent = d.caption;
  fig.append(view, cap);
  sheet.append(fig);
});

document.getElementById('saveAll').onclick = async () => {
  const status = document.getElementById('status');
  for (const [name, c] of cards) {
    await fetch(`/save/${name}.png`, { method: 'POST', body: c.toDataURL('image/png') });
  }
  status.textContent = `saved ${cards.length} cards`;
};
document.body.dataset.ready = '1';
</script>
</body>
</html>
